<!DOCTYPE html>
  <html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Brain">
  <meta name="theme-color" content="#10101A">
  <title>Capture to Brain</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:#10101A;color:#fff;min-height:100vh;font-family:"Century Gothic","Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;}
form{flex:1;display:flex;flex-direction:column;padding:26px 20px 20px;max-width:640px;margin:0 auto;width:100%;}
h1{font-size:22px;margin:0 0 3px;font-weight:700;}
.sub{margin:0 0 18px;font-size:13px;color:#7d8b95;}
textarea{flex:1;min-height:200px;width:100%;background:#1b1b26;color:#fff;border:1.5px solid #2c2c3a;border-radius:12px;padding:15px;font-size:17px;line-height:1.45;font-family:inherit;resize:none;outline:none;}
textarea:focus{border-color:#14AAE0;}
textarea::placeholder{color:#5c6670;}
button{margin-top:14px;width:100%;padding:18px;font-size:17px;font-weight:700;font-family:inherit;background:#14AAE0;color:#04222e;border:none;border-radius:12px;cursor:pointer;}
button:active{background:#0d7ba3;}
.warn{margin-top:14px;font-size:14px;color:#ffb4a2;text-align:center;min-height:20px;}
.hint{margin-top:auto;padding-top:16px;font-size:11.5px;color:#4d5760;text-align:center;line-height:1.5;}
</style>
  </head>
  <body>
  <form id="f" method="GET" action="https://goifjghmzaoxtodhieca.supabase.co/functions/v1/jot">
  <h1>Capture to Brain</h1>
<p class="sub">Tap the box, tap the mic on your keyboard, talk, tap Save.</p>
  <textarea id="t" name="text" placeholder="What's on your mind?" autofocus autocomplete="off"></textarea>
  <input type="hidden" name="key" id="k" value="">
  <input type="hidden" name="source" value="phone">
  <button type="submit">Save to Brain</button>
<div class="warn" id="w"></div>
<p class="hint">Never: community member cases, immigration status,<br>health, salary, staff performance.</p>
  </form>
  <script>
  var key = new URLSearchParams(location.search).get("key") || "";
document.getElementById("k").value = key;
if (!key) { document.getElementById("w").textContent = "No key in this link. Open the bookmarked link, not the plain page."; }
document.getElementById("f").addEventListener("submit", function(e){ var t = document.getElementById("t"); if (!t.value.trim()) { e.preventDefault(); t.focus(); } });
document.getElementById("t").focus();
</script>
  </body>
  </html>
